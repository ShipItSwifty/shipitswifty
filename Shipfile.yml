# ShipIt's own checks exercise the same workflow contracts offered to package users.
test_workflow: ci-macos
workflows:
  format:
    - action: swift-format
      options:
        configuration: .swift-format
        paths: [Sources, Tests/AndroidCLIKitTests, Tests/CLITests, Tests/GradleKitTests, Tests/ShipItKitTests, Tests/XcodeBuildKitTests, Tests/XcodeGenKitTests, Tests/IntegrationTests/Support]
        report_path: build/format.log
      artifacts:
        - name: format
          paths: [build/format.log]
          retention_days: 14
  ci-macos:
    - action: swift-test
      options:
        skip: IntegrationTests
        enable_code_coverage: true
        output_directory: "build/ci/{{run_id}}/unit"
        rerun_failed_tests: { enabled: true, max_attempts: 2 }
        infrastructure_retry: { max_attempts: 3, initial_delay_seconds: 2, max_delay_seconds: 30 }
      artifacts:
        - name: unit-tests
          paths: ["build/ci/{{run_id}}/unit"]
          retention_days: 14
  ci-linux:
    - action: swift-test
      options:
        skip: 'IntegrationTests|XcodeBuildKitTests|XcodeGenKitTests'
        enable_code_coverage: true
        output_directory: "build/ci/{{run_id}}/unit"
        rerun_failed_tests: { enabled: true, max_attempts: 2 }
        infrastructure_retry: { max_attempts: 3, initial_delay_seconds: 2, max_delay_seconds: 30 }
      artifacts:
        - name: unit-tests
          paths: ["build/ci/{{run_id}}/unit"]
          retention_days: 14
  integration-advisory:
    - action: swift-test
      options:
        filter: IntegrationTests
        enable_code_coverage: true
        output_directory: "build/ci/{{run_id}}/integration"
      artifacts:
        - name: integration-tests
          paths: ["build/ci/{{run_id}}/integration"]
          retention_days: 14
  fixtures:
    continue_on_failure: true
    steps:
      - action: swift-test
        options: { filter: FlutterFixtureIntegrationTests }
      - action: swift-test
        options: { filter: ReactNativeFixtureIntegrationTests }
      - action: swift-test
        options: { filter: KMPFixtureIntegrationTests }
      - action: swift-test
        options: { filter: SwiftPMFixtureIntegrationTests }
      # Real Gradle and the real test-retry plugin; opt-in tier, needs a JDK and network.
      - action: swift-test
        options:
          filter: JVMFixtureIntegrationTests
          environment: { SHIPIT_E2E: "1" }
  # The real tools against sample projects with scripted outcomes (see docs/testing.md, "Verifying against real
  # projects"). Needs Flutter, Node, Xcode and a free simulator, so it runs in its own CI job.
  fixtures-real:
    continue_on_failure: true
    steps:
      - action: swift-test
        options:
          filter: FlutterScriptedE2ETests
          environment: { SHIPIT_E2E: "1" }
      - action: swift-test
        options:
          filter: ReactNativeScriptedE2ETests
          environment: { SHIPIT_E2E: "1" }
      - action: swift-test
        options:
          filter: IOSFixtureIntegrationTests
          environment: { SHIPIT_E2E_BUILD: "1" }
  # Runs the real `shipit` binary against the SwiftPM sample on Linux too. Needs only a Swift toolchain.
  fixtures-linux:
    steps:
      - action: swift-test
        options: { filter: SwiftPMFixtureIntegrationTests }
