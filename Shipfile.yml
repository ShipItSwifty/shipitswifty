# Shipfile.yml — Novalingo iOS App
# Beta workflow: increments build number only (Apple-style release semantics).
#
# CFBundleShortVersionString → MAJOR.MINOR.PATCH  (set manually for releases)
# CFBundleVersion            → integer, auto-incremented per beta run

app:
  project: mobile/iOS/Novalingo.xcodeproj
  scheme: Novalingo

# App Store Connect credentials are NOT required for the local-only beta workflow.
# Set these env vars only when you want to upload to App Store Connect:
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY_PATH (or ASC_PRIVATE_KEY)
# app_store_connect:
#   key_id: ${ASC_KEY_ID}
#   issuer_id: ${ASC_ISSUER_ID}
#   key_path: ${ASC_PRIVATE_KEY_PATH}

code_signing:
  type: automatic

build:
  configuration: Release
  derived_data_path: ./DerivedData

archive:
  export_method: app-store
  include_symbols: true
  output_path: ./build/Novalingo.xcarchive

export:
  archive_path: ./build/Novalingo.xcarchive
  output_directory: ./build/export

versioning:
  # Sequential: always increments by 1 so CFBundleVersion stays a plain integer.
  strategy: sequential
  # xcodeproj: reads/writes directly in the .xcodeproj rather than an external
  # version file, keeping CFBundleShortVersionString untouched during beta.
  source: xcodeproj

workflows:
  beta:
    # 1. Bump CFBundleVersion (integer build number) only — marketing version unchanged.
    - action: version
      options:
        bump: build
    # 2. Archive the app.
    - action: archive
    # 3. Export the .ipa locally (no upload to App Store Connect).
    - action: export
