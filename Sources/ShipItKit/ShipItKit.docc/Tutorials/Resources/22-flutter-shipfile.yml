# Shipfile.yml — generated by `shipit generate`
# Flutter project detected. Review before committing.

ios:
  build_system: flutter
android:
  build_system: flutter

workflows:
  beta-ios:
    - action: test
    - action: archive
      options: { platform: ios }
    # Flutter iOS: archive runs `flutter build ipa` — no export step needed.
    # Uncomment when App Store Connect credentials are configured:
    # - action: testflight

  beta-android:
    - action: test
    - action: archive
      options: { platform: android }
    # - action: play-store
