version: 2
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    commit-message:
      prefix: deps
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /actions/test
    labels:
      - dependencies
      - github-actions
    patterns:
      - '*'
    multi-ecosystem-group: dependencies
  - package-ecosystem: swift
    directory: /
    labels:
      - dependencies
      - swift
    patterns:
      - '*'
    multi-ecosystem-group: dependencies
