name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS Universal Binary
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.app

      - name: Stamp version from tag
        run: |
          sed -i.bak 's/static let versionString = "[^"]*"/static let versionString = "'"${GITHUB_REF_NAME}"'"/' Sources/CLI/ShipItCLI.swift
          rm -f Sources/CLI/ShipItCLI.swift.bak
          grep -q "static let versionString = \"${GITHUB_REF_NAME}\"" Sources/CLI/ShipItCLI.swift

      - name: Swift version
        run: swift --version

      - name: Cache SPM dependencies
        uses: actions/cache@v5
        with:
          path: .build/checkouts
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Test
        run: swift test --skip IntegrationTests

      - name: Build arm64
        run: |
          swift build \
            --configuration release \
            --product shipit \
            --arch arm64 \
            --disable-sandbox

      - name: Build x86_64
        run: |
          swift build \
            --configuration release \
            --product shipit \
            --arch x86_64 \
            --disable-sandbox

      - name: Create universal binary
        run: |
          lipo -create -output shipit \
            .build/arm64-apple-macosx/release/shipit \
            .build/x86_64-apple-macosx/release/shipit
          lipo -info shipit

      - name: Package tarball
        run: |
          VERSION="${GITHUB_REF_NAME}"
          tar -czf "shipit-${VERSION}-macos-universal.tar.gz" shipit
          echo "TARBALL=shipit-${VERSION}-macos-universal.tar.gz" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-universal
          path: ${{ env.TARBALL }}
          retention-days: 1

  build-linux:
    name: Build Linux Static Binary
    runs-on: ubuntu-24.04
    container:
      image: swift:6.3.1-noble

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Stamp version from tag
        run: |
          sed -i.bak 's/static let versionString = "[^"]*"/static let versionString = "'"${GITHUB_REF_NAME}"'"/' Sources/CLI/ShipItCLI.swift
          rm -f Sources/CLI/ShipItCLI.swift.bak
          grep -q "static let versionString = \"${GITHUB_REF_NAME}\"" Sources/CLI/ShipItCLI.swift

      - name: Swift version
        run: swift --version

      - name: Cache SPM dependencies
        uses: actions/cache@v5
        with:
          path: .build/checkouts
          key: linux-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            linux-spm-

      - name: Build static binary
        run: |
          swift build \
            --configuration release \
            --product shipit \
            --static-swift-stdlib

      - name: Package tarball
        run: |
          VERSION="${GITHUB_REF_NAME}"
          cp .build/release/shipit shipit
          tar -czf "shipit-${VERSION}-linux-static.tar.gz" shipit
          echo "TARBALL=shipit-${VERSION}-linux-static.tar.gz" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-static
          path: ${{ env.TARBALL }}
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: [build-macos, build-linux]
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: macos-universal

      - name: Download Linux artifact
        uses: actions/download-artifact@v8
        with:
          name: linux-static

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            "/repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="${GITHUB_REF_NAME}" \
            -f target_commitish=main \
            --jq '.body' > release_notes.md

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release_notes.md
          files: |
            shipit-*-macos-universal.tar.gz
            shipit-*-linux-static.tar.gz

      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN not set — skipping tap update. Render Formula/shipit.rb and push to the tap manually per docs/homebrew.md."
            exit 0
          fi

          macos_sha=$(sha256sum "shipit-${VERSION}-macos-universal.tar.gz" | awk '{print $1}')
          linux_sha=$(sha256sum "shipit-${VERSION}-linux-static.tar.gz" | awk '{print $1}')

          sed -e "s/VERSION_PLACEHOLDER/${VERSION}/g" \
              -e "s/MACOS_SHA256_PLACEHOLDER/${macos_sha}/g" \
              -e "s/LINUX_SHA256_PLACEHOLDER/${linux_sha}/g" \
              Formula/shipit.rb > rendered-shipit.rb
          echo "Rendered formula:"
          cat rendered-shipit.rb

          git clone --depth 1 "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/ShipItSwifty/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp rendered-shipit.rb tap/Formula/shipit.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/shipit.rb
          if git diff --cached --quiet; then
            echo "Tap formula already up to date for ${VERSION}."
          else
            git commit -m "shipit ${VERSION}"
            git push
          fi
