name: Build DocC

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow deploying to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-docs:
    name: Build DocC Documentation
    runs-on: macos-26

    steps:
      - name: Checkout ShipItSwifty
        uses: actions/checkout@v5
        with:
          path: ShipItSwifty

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.app

      - name: Cache SPM dependencies
        uses: actions/cache@v5
        with:
          path: ShipItSwifty/.build/checkouts
          key: ${{ runner.os }}-spm-${{ hashFiles('ShipItSwifty/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build DocC for ShipItKit
        working-directory: ShipItSwifty
        run: |
          swift package \
            --allow-writing-to-directory ./docs-output \
            generate-documentation \
            --target ShipItKit \
            --disable-indexing \
            --transform-for-static-hosting \
            --hosting-base-path shipitswifty \
            --output-path ./docs-output

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ShipItSwifty/docs-output

  deploy-docs:
    name: Deploy to GitHub Pages
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
