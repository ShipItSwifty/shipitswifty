name: Mirror Swift Image to GHCR

# Manual only — this rarely changes. Re-run whenever the pinned Swift toolchain
# version (currently 6.3.1) is bumped in ci.yml/release.yml, to refresh the mirror
# before updating those workflows' container reference.
on:
  workflow_dispatch:
    inputs:
      swift_tag:
        description: Upstream swift Docker Hub tag to mirror (e.g. 6.3.1-noble)
        required: true
        default: 6.3.1-noble

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    name: Mirror swift:${{ inputs.swift_tag }} to GHCR
    runs-on: ubuntu-24.04

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull from Docker Hub, tag, and push to GHCR
        run: |
          set -euo pipefail
          SOURCE="swift:${{ inputs.swift_tag }}"
          TARGET="ghcr.io/${{ github.repository_owner }}/swift:${{ inputs.swift_tag }}"
          # Lowercase, as GHCR image paths are case-sensitive and reject uppercase.
          TARGET=$(echo "$TARGET" | tr '[:upper:]' '[:lower:]')

          docker pull "$SOURCE"
          docker tag "$SOURCE" "$TARGET"
          docker push "$TARGET"
          echo "Mirrored $SOURCE -> $TARGET"
