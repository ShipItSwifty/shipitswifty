name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-26

    steps:
      - name: Checkout ShipItSwifty
        uses: actions/checkout@v5
        with:
          path: ShipItSwifty

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.app

      - name: Swift version
        run: swift --version

      - name: Build
        working-directory: ShipItSwifty
        run: swift build

      - name: Test
        working-directory: ShipItSwifty
        run: swift test --enable-code-coverage

      - name: Generate coverage report
        working-directory: ShipItSwifty
        run: |
          xcrun llvm-cov export \
            .build/debug/ShipItSwiftyPackageTests.xctest/Contents/MacOS/ShipItSwiftyPackageTests \
            -instr-profile .build/debug/codecov/default.profdata \
            -format lcov \
            > coverage.lcov
        continue-on-error: true

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          files: ShipItSwifty/coverage.lcov
          working-directory: ShipItSwifty
        continue-on-error: true
