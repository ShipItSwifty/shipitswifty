name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-26

    steps:
      - name: Checkout ShipItSwifty
        uses: actions/checkout@v6
        with:
          path: ShipItSwifty
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.app

      - name: Swift version
        run: swift --version

      - name: Cache SPM dependencies
        uses: actions/cache@v5
        with:
          path: ShipItSwifty/.build/checkouts
          key: ${{ runner.os }}-spm-${{ hashFiles('ShipItSwifty/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Android SDK
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms
            ${{ env.ANDROID_HOME }}/build-tools
          key: ${{ runner.os }}-android-sdk-platform-35-buildtools-35.0.0
          restore-keys: |
            ${{ runner.os }}-android-sdk-

      - name: Install Android SDK components
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build
        working-directory: ShipItSwifty
        run: swift build

      - name: Test (unit + CLI)
        working-directory: ShipItSwifty
        run: swift test --enable-code-coverage --skip IntegrationTests

      - name: Test (integration, non-blocking, no credentials)
        working-directory: ShipItSwifty
        run: swift test --filter IntegrationTests --enable-code-coverage
        continue-on-error: true

      - name: Generate coverage report
        working-directory: ShipItSwifty
        run: |
          XCTEST_BIN=$(find .build -name "ShipItSwiftyPackageTests.xctest" -type d | head -1)
          xcrun llvm-cov export \
            "$XCTEST_BIN/Contents/MacOS/ShipItSwiftyPackageTests" \
            -instr-profile .build/debug/codecov/default.profdata \
            -ignore-filename-regex='Tests/|.build/' \
            -format lcov \
            > coverage.lcov

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          files: ShipItSwifty/coverage.lcov
          working-directory: ShipItSwifty
          fail_ci_if_error: false
