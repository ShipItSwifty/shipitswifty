name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-26

    steps:
      - name: Checkout ShipItSwifty
        uses: actions/checkout@v5
        with:
          path: ShipItSwifty

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.app

      - name: Swift version
        run: swift --version

      - name: Cache SPM dependencies
        uses: actions/cache@v5
        with:
          path: ShipItSwifty/.build/checkouts
          key: ${{ runner.os }}-spm-${{ hashFiles('ShipItSwifty/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Android SDK components
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build
        working-directory: ShipItSwifty
        run: swift build

      - name: Test
        working-directory: ShipItSwifty
        run: swift test --enable-code-coverage

      - name: Generate coverage report
        working-directory: ShipItSwifty
        run: |
          xcrun llvm-cov export \
            .build/debug/ShipItSwiftyPackageTests.xctest/Contents/MacOS/ShipItSwiftyPackageTests \
            -instr-profile .build/debug/codecov/default.profdata \
            -format lcov \
            > coverage.lcov
        continue-on-error: true

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          files: ShipItSwifty/coverage.lcov
          working-directory: ShipItSwifty
        continue-on-error: true
